<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивное меню кафе</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Меню нашего кафе</h1>
        <!-- Контейнер для кнопок фильтрации -->
        <div class="filters" id="filter-buttons">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="пицца">Пицца</button>
            <button class="filter-btn" data-category="роллы">Роллы</button>
            <button class="filter-btn" data-category="суши">Суши</button>
            <button class="filter-btn" data-category="напитки">Напитки</button>
        </div>
        
        <!-- Кнопка корзины в шапке -->
        <div class="cart-status" id="cart-toggle">
            🛒 Корзина: <span id="cart-count">0</span> товаров
        </div>
    </header>

    <main>
        <!-- Сюда JavaScript будет вставлять карточки блюд -->
        <div class="menu-grid" id="menu-container"></div>
    </main>

    <!-- Окно корзины (скрыто по умолчанию) -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <span class="close-cart" id="close-cart">&times;</span>
            <h2>Ваш заказ</h2>
            <div id="cart-items-list">
                <!-- Сюда JS добавит товары из корзины -->
            </div>
            <hr>
            <div class="cart-total">
                Итого: <span id="cart-total-price">0 ₽</span>
            </div>
            <button class="order-btn" id="checkout-btn">Оформить заказ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
